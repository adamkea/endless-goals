<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Endless Goals</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0a0a;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.85);
        font-family: system-ui, sans-serif;
        font-size: 14px;
        background: rgba(0, 0, 0, 0.35);
        padding: 6px 14px;
        border-radius: 8px;
        user-select: none;
        pointer-events: none;
      }
      #shoot-ui {
        position: fixed;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%);
        width: 220px;
        opacity: 0;
        transition: opacity 0.12s;
        font-family: system-ui, sans-serif;
        user-select: none;
        pointer-events: none;
      }
      #shoot-ui.active {
        opacity: 1;
      }
      #power-track {
        height: 14px;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 7px;
        overflow: hidden;
      }
      #power-fill {
        height: 100%;
        width: 0%;
        background: hsl(110, 90%, 52%);
        border-radius: 7px;
      }
      #curve-track {
        position: relative;
        margin-top: 8px;
        height: 6px;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 3px;
      }
      #curve-track::after {
        content: '';
        position: absolute;
        left: 50%;
        top: -3px;
        width: 2px;
        height: 12px;
        background: rgba(255, 255, 255, 0.5);
      }
      #curve-dot {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #fff;
        z-index: 1;
      }
      .shoot-label {
        margin-top: 4px;
        text-align: center;
        color: rgba(255, 255, 255, 0.75);
        font-size: 11px;
        letter-spacing: 0.12em;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      &#8592; / &#8594; or A / D to move &middot; click &amp; hold to shoot
      &middot; drag sideways for curve
    </div>
    <div id="shoot-ui">
      <div id="power-track"><div id="power-fill"></div></div>
      <div id="curve-track"><div id="curve-dot"></div></div>
      <div class="shoot-label">POWER &middot; CURVE</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
